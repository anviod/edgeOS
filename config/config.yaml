# EdgeOS 默认配置说明（bboltDB 存储）
#
# EdgeOS 运行时配置已全部迁移至 bboltDB（data/config.db），不再读取/依赖任何 YAML 配置文件。
# 首次启动自动执行「默认安装初始化」：将默认配置写入 data/config.db；重启从数据库恢复，无需配置文件。
#
# 配置 CRUD 均通过 Web UI / API 写入 data/config.db（配置库为唯一数据源）。
#
# ---
#
# EdgeOS default config (bboltDB-backed)
#
# All runtime configuration is stored in bboltDB (data/config.db). No YAML config
# file is read or required at runtime. On first start the default configuration is
# written to data/config.db automatically (default install initialization); restarts
# recover from the database without any config file.
