<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}"
    />
    <script>
      (function () {
        var storedTheme = localStorage.getItem('edgeos-docs-theme');
        var theme = storedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=3" />
  </head>
  <body class="page-body">
    <div class="site-shell">
      <header class="site-header">
        <div class="site-header__inner">
          <a class="site-brand" href="{{ '/' | relative_url }}">
            <span class="site-brand__eyebrow">Industrial Edge</span>
            <span class="site-brand__title">EdgeOS</span>
          </a>
          <nav class="site-nav" aria-label="主导航">
            <a href="{{ '/' | relative_url }}">文档</a>
            <a href="{{ '/EdgeOS 后端实现指南.html' | relative_url }}">架构</a>
            <a href="{{ '/edgeCore通信协议规范(MQTT-NATS).html' | relative_url }}">协议</a>
            <a href="{{ '/#ai-capabilities' | relative_url }}">AI 能力</a>
            <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button
              class="theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="切换主题"
              aria-pressed="false"
            >
              <span data-theme-icon>暗黑</span>
            </button>
          </nav>
        </div>
      </header>

      <main class="doc-shell">
        <div class="doc-shell__inner">
          <div class="doc-intro">
            <p class="doc-intro__eyebrow">Documentation</p>
            <h1>{{ page.title | default: site.title }}</h1>
            {% if page.description %}
              <p class="doc-intro__summary">{{ page.description }}</p>
            {% endif %}
          </div>

          <article class="doc-content">
            {{ content }}
          </article>
        </div>
      </main>

      <footer class="site-footer">
        <div class="site-footer__row">
          <span class="site-footer__brand">EdgeOS</span>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__tagline">EAN 2.0 协调平面</span>
          <span class="site-footer__divider">|</span>
          <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="site-footer__divider">|</span>
          
          <a href="{{ '/样式规范.html' | relative_url }}">样式指南</a>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__copy">开源 · MIT 许可证</span>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        var storageKey = 'edgeos-docs-theme';
        var root = document.documentElement;
        var button = document.querySelector('[data-theme-toggle]');
        var icon = document.querySelector('[data-theme-icon]');
        if (!button) return;

        function syncTheme(theme) {
          root.setAttribute('data-theme', theme);
          if (icon) icon.textContent = theme === 'light' ? '暗黑' : '明亮';
          button.setAttribute('aria-pressed', String(theme === 'light'));
        }

        syncTheme(root.getAttribute('data-theme') || 'dark');

        button.addEventListener('click', function () {
          var currentTheme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
          var nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
          syncTheme(nextTheme);
          localStorage.setItem(storageKey, nextTheme);
        });
      })();
    </script>
  </body>
</html>
