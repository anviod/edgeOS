<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}"
    />
    <script>
      (function () {
        var storedTheme = localStorage.getItem('edgeos-docs-theme');
        var theme = storedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=3" />
    <link rel="stylesheet" href="{{ '/assets/effects.css' | relative_url }}?v=3" />
    <style>
      /* 平台定位 — 数字化基石 */
      .platform-card {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--gold-border);
        border-left: 3px solid var(--gold);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .platform-card::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
        box-shadow: 0 0 8px rgba(200, 167, 91, 0.3);
      }
      .platform-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 50% at 0% 50%, rgba(200, 167, 91, 0.08), transparent 60%);
        pointer-events: none;
      }
      .platform-card:hover {
        transform: translateY(-4px);
        border-color: var(--gold-border-hover);
        border-left-color: var(--gold-bright);
        box-shadow: var(--shadow-gold-lg);
      }
      .platform-card:hover::before {
        box-shadow: 0 0 16px rgba(200, 167, 91, 0.5);
      }

      /* 核心能力 — 军工级边框 */
      .capability-card {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--gold-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background-image:
          linear-gradient(rgba(200, 167, 91, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200, 167, 91, 0.06) 1px, transparent 1px);
        background-size: 12px 12px;
        background-position: center;
      }
      .capability-card::before {
        content: "";
        position: absolute;
        top: 8px; left: 8px;
        width: 16px; height: 16px;
        border-top: 2px solid var(--gold-light);
        border-left: 2px solid var(--gold-light);
      }
      .capability-card::after {
        content: "";
        position: absolute;
        bottom: 8px; right: 8px;
        width: 16px; height: 16px;
        border-bottom: 2px solid var(--gold-light);
        border-right: 2px solid var(--gold-light);
        opacity: 0.5;
        transition: all 0.3s ease;
      }
      .capability-card:hover {
        border-color: var(--gold-border-hover);
        box-shadow: var(--shadow-gold-lg);
        transform: translateY(-6px) scale(1.01);
      }
      .capability-card:hover::after {
        opacity: 1;
        width: 22px; height: 22px;
        box-shadow: 3px 3px 8px rgba(200, 167, 91, 0.25);
      }

      /* 业务场景 — 场景卡片 */
      .scene-card {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--gold-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .scene-card:hover {
        transform: translateY(-6px) scale(1.01);
        background: var(--glass-strong);
      }
      .scene-card.grid-node:hover {
        border-color: rgba(200, 167, 91, 0.6);
        box-shadow: 0 12px 40px rgba(200, 167, 91, 0.15);
      }
      .scene-card.energy-node:hover {
        border-color: rgba(0, 200, 120, 0.6);
        box-shadow: 0 12px 40px rgba(0, 200, 120, 0.15);
      }
      .scene-card.traffic-node:hover {
        border-color: rgba(0, 200, 255, 0.6);
        box-shadow: 0 12px 40px rgba(0, 200, 255, 0.15);
      }
      .scene-card.ai-node:hover {
        border-color: rgba(180, 80, 255, 0.6);
        box-shadow: 0 12px 40px rgba(180, 80, 255, 0.15);
      }
      .scene-card.center-node:hover {
        border-color: rgba(0, 220, 255, 0.6);
        box-shadow: 0 12px 40px rgba(0, 220, 255, 0.15);
      }
    </style>
  </head>
  <body class="landing-body">
    <div class="landing-shell">
      <header class="site-header site-header--landing" id="landingHeader">
        <div class="site-header__inner">
          <a class="site-brand" href="{{ '/' | relative_url }}">
            <span class="site-brand__eyebrow">Industrial Edge</span>
            <span class="site-brand__title">EdgeOS</span>
          </a>
          <nav class="site-nav" aria-label="主导航">
            <a href="{{ '/' | relative_url }}">文档</a>
            <a href="{{ '/EdgeOS 后端实现指南.html' | relative_url }}">架构</a>
            <a href="{{ '/EdgeX通信协议规范(MQTT-NATS).html' | relative_url }}">协议</a>
            <a href="{{ '/#ai-capabilities' | relative_url }}">AI 能力</a>
            <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button
              class="theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="切换主题"
              aria-pressed="false"
            >
              <span data-theme-icon>暗黑</span>
            </button>
          </nav>
        </div>
      </header>

      <main class="landing-main">
        <div class="shell">
          {{ content }}
        </div>
      </main>

      <footer class="site-footer">
        <div class="site-footer__row">
          <span class="site-footer__brand">EdgeOS</span>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__tagline">EAN 2.0 协调平面</span>
          <span class="site-footer__divider">|</span>
          <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__copy">开源 · MIT 许可证</span>
          <span class="site-footer__divider">|</span>
          <a href="{{ '/样式规范.html' | relative_url }}">样式指南</a>
          <span class="site-footer__divider">|</span>
          <a href="https://anviod.github.io/edgex/" target="_blank" rel="noopener noreferrer">EdgeX 官方文档</a>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        // Theme toggle
        var storageKey = 'edgeos-docs-theme';
        var root = document.documentElement;
        var button = document.querySelector('[data-theme-toggle]');
        var icon = document.querySelector('[data-theme-icon]');

        function syncTheme(theme) {
          root.setAttribute('data-theme', theme);
          if (icon) icon.textContent = theme === 'light' ? '暗黑' : '明亮';
          if (button) button.setAttribute('aria-pressed', String(theme === 'light'));
        }

        var current = root.getAttribute('data-theme') || 'dark';
        syncTheme(current);

        if (button) {
          button.addEventListener('click', function () {
            var now = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            var next = now === 'dark' ? 'light' : 'dark';
            syncTheme(next);
            localStorage.setItem(storageKey, next);
          });
        }

        // Navbar scroll effect
        var header = document.getElementById('landingHeader');
        if (header) {
          window.addEventListener('scroll', function () {
            if (window.scrollY > 20) {
              header.classList.add('scrolled');
            } else {
              header.classList.remove('scrolled');
            }
          });
        }

      })();
    </script>
    <script src="{{ '/assets/script.js' | relative_url }}?v=3"></script>
  </body>
</html>
