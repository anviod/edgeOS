<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}"
    />
    <script>
      (function () {
        var storedTheme = localStorage.getItem('edgeos-docs-theme');
        var theme = storedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
  </head>
  <body class="landing-body">
    <div class="landing-shell">
      <header class="site-header site-header--landing" id="landingHeader">
        <div class="site-header__inner">
          <a class="site-brand" href="{{ '/' | relative_url }}">
            <span class="site-brand__eyebrow">Industrial AI</span>
            <span class="site-brand__title">EdgeOS</span>
          </a>
          <nav class="site-nav" aria-label="主导航">
            <a href="{{ '/' | relative_url }}">文档</a>
            <a href="{{ '/EdgeOS 后端实现指南.html' | relative_url }}">架构</a>
            <a href="{{ '/EdgeX通信协议规范(MQTT-NATS).html' | relative_url }}">驱动</a>
            <a href="{{ '/EdgeOS UI规划文档.html' | relative_url }}">智能</a>
            <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button
              class="theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="切换主题"
              aria-pressed="false"
            >
              <span data-theme-icon>🌙</span>
            </button>
          </nav>
        </div>
      </header>

      <main class="landing-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="site-footer__row">
          <span class="site-footer__brand">EdgeOS</span>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__tagline">工业智能 · 企业边缘平台</span>
          <span class="site-footer__divider">|</span>
          <a href="https://github.com/anviod/EdgeOS" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="site-footer__divider">|</span>
          <a href="{{ '/EdgeOS-2026-P3-TODO.html' | relative_url }}">P3 路线图</a>
          <span class="site-footer__divider">|</span>
          <a href="{{ '/样式规范.html' | relative_url }}">样式指南</a>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__copy">开源 · MIT 许可证</span>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        // Theme toggle
        var storageKey = 'edgeos-docs-theme';
        var root = document.documentElement;
        var button = document.querySelector('[data-theme-toggle]');
        var icon = document.querySelector('[data-theme-icon]');

        function syncTheme(theme) {
          root.setAttribute('data-theme', theme);
          if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
          if (button) button.setAttribute('aria-pressed', String(theme === 'light'));
        }

        var current = root.getAttribute('data-theme') || 'dark';
        syncTheme(current);

        if (button) {
          button.addEventListener('click', function () {
            var now = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            var next = now === 'dark' ? 'light' : 'dark';
            syncTheme(next);
            localStorage.setItem(storageKey, next);
          });
        }

        // Navbar scroll effect
        var header = document.getElementById('landingHeader');
        if (header) {
          window.addEventListener('scroll', function () {
            if (window.scrollY > 20) {
              header.classList.add('scrolled');
            } else {
              header.classList.remove('scrolled');
            }
          });
        }

        // Typewriter effect
        var tw = document.querySelector('.hero h2 .typewriter');
        if (tw) {
          var lines = [
            "构建一次，随处部署。",
            "N+2 高可用边缘大脑",
            "MQTT / NATS 双通道冗余",
            "ShadowCore 实时推理引擎"
          ];
          var lineIndex = 0, i = 0, deleting = false;
          function tick() {
            var text = lines[lineIndex];
            if (!deleting) {
              i++;
              tw.textContent = text.slice(0, i);
              if (i >= text.length) { deleting = true; setTimeout(tick, 3000); return; }
            } else {
              i--;
              tw.textContent = text.slice(0, i);
              if (i <= 0) { deleting = false; lineIndex = (lineIndex + 1) % lines.length; setTimeout(tick, 500); return; }
            }
            setTimeout(tick, deleting ? 50 : 140);
          }
          tick();
        }
      })();
    </script>
  </body>
</html>
