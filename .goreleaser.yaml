version: 2
# goreleaser release --snapshot --clean
project_name: edgeOS
dist: ./dist

before:
  hooks:
    - go mod tidy
    # - npm run build --prefix ./ui # npm run dev --prefix ./ui

builds:
  - id: edgeOS
    main: ./cmd/main.go
    binary: edgeOS
    flags:
      - -trimpath
      - -mod=vendor
    env:
      - CGO_ENABLED=0
    ldflags: >
      -s -w
      -X github.com/anviod/edgeOS/internal/model.Version={{.Version}}
      -X 'github.com/anviod/edgeOS/internal/model.BuildTime={{.Date}}'
      -X github.com/anviod/edgeOS/internal/model.CommitID={{.ShortCommit}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: edgeOS-archive
    formats: [ 'tar.gz' ]
    name_template: '{{.ProjectName}}-{{.RawVersion}}-{{.Os}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}'
    files:
      - scripts/**
      - edgeOS.service
      - ui/dist/**

nfpms:
  - id: edgeOS-deb
    package_name: edgeOS
    file_name_template: 'edgeOS-v{{.RawVersion}}-{{.Arch}}'
    formats:
      - deb
      - rpm
    vendor: HNE Inc.
    homepage: https://github.com/anviod/edgeOS
    maintainer: anviod <anviod@aliyun.com>
    description: 边缘网关，基于 Go 语言的边缘网络通讯与同步服务
    license: Apache-2.0
    bindir: /opt/edgeOS
    contents:
      - src: ./edgeOS.service
        dst: /etc/systemd/system/edgeOS.service
        type: config
      - src: ./ui/dist
        dst: /opt/edgeOS/ui/dist
        type: tree
    scripts:
      preinstall: scripts/preinstall.sh
      postinstall: scripts/postinstall.sh

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
